[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy /api/ai-assistant to the Netlify Serverless Function
[[redirects]]
  from = "/api/ai-assistant"
  to = "/.netlify/functions/ai-assistant"
  status = 200

# Single Page Application fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
